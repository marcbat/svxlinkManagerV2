# SvxLink configuration file - Nœud 2 (test de connexion multi-nœuds)
# Utilisé uniquement pour tester la connexion de plusieurs nœuds au même réflecteur
# Version compatible: SVXLink 25.05 (protocole V2 legacy)
################################################################################
# GLOBAL Configuration
################################################################################

[GLOBAL]
LOGICS=ReflectorLogic
CFG_DIR=/etc/svxlink/conf.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=16000
CARD_CHANNELS=1

[ReflectorLogic]
TYPE=ReflectorV2
HOST=svxreflector
PORT=5300
CALLSIGN=HB9GXP2-H
AUTH_KEY=Passw0rd
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=0
DEFAULT_LANG=fr_FR
EVENT_HANDLER=/usr/share/svxlink/events.d/local/Logic.tcl

# Récepteur avec périphérique audio null (pas de hardware dans le container)
[Rx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
SQL_DET=VOX
VOX_FILTER_DEPTH=1
VOX_THRESH=0.001

# Émetteur avec périphérique audio null et PTT Dummy (pas de hardware dans le container)
[Tx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
PTT_TYPE=Dummy
TIMEOUT=300
