# SvxLink configuration file
# Configuration Docker développement — nœud principal (svxlinkmanager-app)
# Audio null (pas de hardware dans le container), réflecteur local Docker
# Version compatible: SVXLink 19.09.2
################################################################################

[GLOBAL]
LOGICS=SimplexLogic,ReflectorLogic
LINKS=LinkToReflector
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=16000  # 16000 Hz adapté pour le codec OPUS en Docker (null audio)
CARD_CHANNELS=1

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleHelp,ModuleParrot
CALLSIGN=HB9GXP
SHORT_IDENT_INTERVAL=15
LONG_IDENT_INTERVAL=60
IDENT_ONLY_AFTER_TX=10
EXEC_CMD_ON_SQL_CLOSE=500
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=fr_FR
RGR_SOUND_ALWAYS=1
RGR_SOUND_DELAY=0
REPORT_CTCSS=136.5
TX_CTCSS=ALWAYS
MACROS=Macros
FX_GAIN_NORMAL=0
FX_GAIN_LOW=-12
MUTE_RX_ON_TX=1
DTMF_CTRL_PTY=/tmp/dtmf_uhf

[Macros]
1=EchoLink:9999#

[LinkToReflector]
CONNECT_LOGICS=SimplexLogic,ReflectorLogic
DEFAULT_ACTIVE=1
TIMEOUT=0

[ReflectorLogic]
TYPE=Reflector
HOST=svxreflector
PORT=5300
CALLSIGN=HB9GXP-H
AUTH_KEY=Passw0rd
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=0
DEFAULT_LANG=fr_FR

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
SQL_DET=VOX
VOX_FILTER_DEPTH=1
VOX_THRESH=0.001
SQL_START_DELAY=500
SQL_DELAY=150
SQL_HANGTIME=20
SQL_EXTENDED_HANGTIME=1000
SQL_EXTENDED_HANGTIME_THRESH=13
SQL_TIMEOUT=600
DEEMPHASIS=0
SQL_TAIL_ELIM=0
PREAMP=-4
PEAK_METER=1
DTMF_DEC_TYPE=INTERNAL
DTMF_MUTING=1
DTMF_HANGTIME=40
1750_MUTING=1

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
PTT_TYPE=Dummy
TIMEOUT=300
TX_DELAY=900
PREAMP=0
CTCSS_FQ=71.9
CTCSS_LEVEL=9
PREEMPHASIS=0
DTMF_TONE_LENGTH=100
DTMF_TONE_SPACING=50
DTMF_DIGIT_PWR=-15

[ModuleHelp]
NAME=ModuleHelp
ID=1
TIMEOUT=10

[ModuleParrot]
NAME=ModuleParrot
ID=2
TIMEOUT=180

