# SvxLink configuration file
# Configuration de base pour SvxLink Manager V2
# Version compatible: SVXLink 19.09.2

################################################################################
# GLOBAL Configuration
################################################################################
[GLOBAL]
LOGICS=SimplexLogic,ReflectorLogic
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=16000
CARD_CHANNELS=1

################################################################################
# SimplexLogic Configuration (Configuration locale)
################################################################################
[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleHelp,ModuleParrot,ModuleTclVoiceMail
CALLSIGN=NOCALL
SHORT_IDENT_INTERVAL=60
LONG_IDENT_INTERVAL=60
IDENT_ONLY_AFTER_TX=1
EXEC_CMD_ON_SQL_CLOSE=1
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=fr_FR
RGR_SOUND_DELAY=0
REPORT_CTCSS=136.5
MACROS=Macros

[Macros]
1=EchoLink:9999#

################################################################################
# ReflectorLogic Configuration (Connexion Reflector)
################################################################################
[ReflectorLogic]
TYPE=Reflector
HOST=svxreflector
PORT=5300
CALLSIGN=HB9GXP-H
AUTH_KEY=Passw0rd
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=0
DEFAULT_LANG=fr_FR

################################################################################
# Receiver Configuration
################################################################################
[Rx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
SQL_DET=GPIO
GPIO_PATH=/sys/class/gpio/gpio17/value
SQL_START_DELAY=500
SQL_DELAY=150
SQL_HANGTIME=2000
SQL_EXTENDED_HANGTIME=3000

################################################################################
# Transmitter Configuration
################################################################################
[Tx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
PTT_TYPE=GPIO
PTT_PORT=/sys/class/gpio/gpio27/value
TIMEOUT=300
TX_DELAY=900

################################################################################
# ModuleHelp Configuration
################################################################################
[ModuleHelp]
NAME=ModuleHelp
ID=1
TIMEOUT=10

################################################################################
# ModuleParrot Configuration
################################################################################
[ModuleParrot]
NAME=ModuleParrot
ID=2
TIMEOUT=180

################################################################################
# ModuleTclVoiceMail Configuration
################################################################################
[ModuleTclVoiceMail]
NAME=ModuleTclVoiceMail
ID=3
TIMEOUT=180
