# SvxLink configuration file
# Template utilisé par SvxLinkConfigurationService pour générer la configuration
# CARD_SAMPLE_RATE=16000 par défaut
# Version compatible: SVXLink 25.05
################################################################################

[GLOBAL]
LOGICS=SimplexLogic
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=16000
CARD_CHANNELS=1

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleHelp
CALLSIGN=F0DTMF
SHORT_IDENT_INTERVAL=600
LONG_IDENT_INTERVAL=3600
IDENT_ONLY_AFTER_TX=1
EXEC_CMD_ON_SQL_CLOSE=1
EVENT_HANDLER=/opt/svxlink-modern/share/svxlink/events.tcl
DEFAULT_LANG=fr_FR
RGR_SOUND_ALWAYS=1
RGR_SOUND_DELAY=0
REPORT_CTCSS=136.5
TX_CTCSS=ALWAYS
MACROS=Macros
FX_GAIN_NORMAL=0
FX_GAIN_LOW=-12
MUTE_RX_ON_TX=1
DTMF_CTRL_PTY=/tmp/dtmf_uhf

[Macros]
1=EchoLink:9999#

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
SQL_DET=GPIO
GPIO_SQL_PIN=gpio10
SQL_START_DELAY=500
SQL_DELAY=150
SQL_HANGTIME=20
SQL_EXTENDED_HANGTIME=1000
SQL_EXTENDED_HANGTIME_THRESH=13
SQL_TIMEOUT=600
VOX_FILTER_DEPTH=300
VOX_THRESH=1000
CTCSS_MODE=0
CTCSS_FQ=71.9
CTCSS_SNR_OFFSET=0
CTCSS_OPEN_THRESH=15
CTCSS_CLOSE_THRESH=9
CTCSS_BPF_LOW=60
CTCSS_BPF_HIGH=260
GPIO_PATH=/sys/class/gpio
DEEMPHASIS=0
SQL_TAIL_ELIM=0
PREAMP=-4
PEAK_METER=1
DTMF_DEC_TYPE=INTERNAL
DTMF_MUTING=1
DTMF_HANGTIME=40
1750_MUTING=1

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
PTT_TYPE=GPIO
GPIO_PATH=/sys/class/gpio
PTT_PIN=gpio7
TIMEOUT=300
TX_DELAY=900
PREAMP=0
CTCSS_FQ=71.9
CTCSS_LEVEL=9
PREEMPHASIS=0
DTMF_TONE_LENGTH=100
DTMF_TONE_SPACING=50
DTMF_DIGIT_PWR=-15

[ModuleHelp]
NAME=ModuleHelp
ID=1
TIMEOUT=10

[ModuleParrot]
NAME=Parrot
ID=2
TIMEOUT=180
FIFO_LEN=60
REPEAT_DELAY=1000

[LinkToReflector]
CONNECT_LOGICS=SimplexLogic,ReflectorLogic
DEFAULT_ACTIVE=1
TIMEOUT=0

# CALLSIGN devient le Common Name du certificat X.509 en protocole V3, et il est
# confronté à ACCEPT_CALLSIGN côté serveur : ni espace ni parenthèse ne sont
# admis. SvxLinkConfigurationService y réécrit l'indicatif du salon à
# l'activation, mais la valeur versionnée doit rester lançable telle quelle.
#
# EVENT_HANDLER pointe sur /opt/svxlink-modern : ce template cible SVXLink 25.05.
# Tout chemin vers un binaire, un son ou une config passe par la stratégie de
# version — aucun chemin svxlink-legacy n'a sa place ici.
[ReflectorLogic]
TYPE=Reflector
HOST=rrf2.f5nlg.ovh
PORT=5300
CALLSIGN=HB9GXP-H
AUTH_KEY=Magnifique123456789!
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=0
DEFAULT_LANG=fr_FR
EVENT_HANDLER=/opt/svxlink-modern/share/svxlink/events.d/local/Logic.tcl

