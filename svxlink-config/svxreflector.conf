###################################################################
#
# Configuration SvxReflector 25.05 - V3 UNIQUEMENT (Certificats X.509)
# Refuse les connexions legacy (AUTH_KEY)
#
###################################################################

[GLOBAL]
TIMESTAMP_FORMAT="%c"
LISTEN_PORT=5300

# Accepter tous les callsigns
ACCEPT_CALLSIGN=.*

# Codec audio
CODECS=OPUS

# PKI — Certificats X.509 (V3)
CERT_PKI_DIR=/var/lib/svxlink/pki
CERT_CA_HOOK=/usr/local/bin/dev-ca-hook.sh

###################################################################
# ROOT_CA : Autorité de certification racine
###################################################################
[ROOT_CA]
COMMON_NAME=SvxReflector Dev Root CA
COUNTRY=CH

###################################################################
# ISSUING_CA : CA intermédiaire qui signe les CSR
###################################################################
[ISSUING_CA]
COMMON_NAME=SvxReflector Dev Issuing CA
COUNTRY=CH

###################################################################
# SERVER_CERT : Certificat du serveur
###################################################################
[SERVER_CERT]
COMMON_NAME=svxreflector
SUBJECT_ALT_NAME=DNS:svxreflector,DNS:localhost,IP:127.0.0.1

###################################################################
# TG#0 : Talkgroup par défaut
###################################################################
[TG#0]
ALLOW=.*
SHOW_ACTIVITY=1