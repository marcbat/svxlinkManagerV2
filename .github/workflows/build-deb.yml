name: Build Debian Package

on:
  push:
    branches:
      - main
      - master
      - develop
      - release/**
      - hotfix/**
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publier aussi une GitHub Release avec le .deb
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.4.2
        with:
          versionSpec: 6.7.0

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.4.2
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Calcul de version Debian
        id: version
        shell: pwsh
        run: |
          $majorMinorPatch = '${{ steps.gitversion.outputs.majorMinorPatch }}'
          $semVer = '${{ steps.gitversion.outputs.semVer }}'
          $refName = '${{ github.ref_name }}'
          $refType = '${{ github.ref_type }}'
          $commitsSinceVersionSource = '${{ steps.gitversion.outputs.commitsSinceVersionSource }}'

          function Convert-ToDebLabel([string]$value) {
              if ([string]::IsNullOrWhiteSpace($value)) {
                  return 'ci'
              }

              $sanitized = $value.ToLowerInvariant()
              $sanitized = $sanitized -replace '[^0-9a-z.+~]+', '.'
              $sanitized = $sanitized.Trim('.')

              if ([string]::IsNullOrWhiteSpace($sanitized)) {
                  return 'ci'
              }

              return $sanitized
          }

          if ([string]::IsNullOrWhiteSpace($commitsSinceVersionSource)) {
              $commitsSinceVersionSource = '0'
          }

          $isPreRelease = $true
          if ($refType -eq 'tag' -or $refName -in @('main', 'master')) {
              $debVersion = $majorMinorPatch
              $isPreRelease = $false
          }
          elseif ($refName -eq 'develop') {
              $preReleaseNumber = ($semVer -replace '^[0-9]+\.[0-9]+\.[0-9]+-[a-z]+\.', '')
              $debVersion = "$majorMinorPatch~alpha.$preReleaseNumber"
          }
          elseif ($refName.StartsWith('release/')) {
              $preReleaseNumber = ($semVer -replace '^[0-9]+\.[0-9]+\.[0-9]+-[a-z]+\.', '')
              $debVersion = "$majorMinorPatch~beta.$preReleaseNumber"
          }
          elseif ($refName.StartsWith('hotfix/')) {
              $preReleaseNumber = ($semVer -replace '^[0-9]+\.[0-9]+\.[0-9]+-[a-z]+\.', '')
              $debVersion = "$majorMinorPatch~beta.$preReleaseNumber"
          }
          elseif ($refName.StartsWith('feature/')) {
              $featureLabel = Convert-ToDebLabel($refName.Substring('feature/'.Length))
              $preReleaseNumber = ($semVer -replace '^[0-9]+\.[0-9]+\.[0-9]+-[a-z.]+\.', '')
              $debVersion = "$majorMinorPatch~$featureLabel.$preReleaseNumber"
          }
          elseif ($refName.StartsWith('copilot/')) {
              $featureLabel = Convert-ToDebLabel($refName.Substring('copilot/'.Length))
              $preReleaseNumber = ($semVer -replace '^[0-9]+\.[0-9]+\.[0-9]+-[a-z.]+\.', '')
              $debVersion = "$majorMinorPatch~$featureLabel.$preReleaseNumber"
          }
          else {
              $branchLabel = Convert-ToDebLabel($refName)
              $preReleaseNumber = ($semVer -replace '^[0-9]+\.[0-9]+\.[0-9]+-[a-z.]+\.', '')
              $debVersion = "$majorMinorPatch~$branchLabel.$preReleaseNumber"
          }

          $releaseTag = 'v' + ($semVer -replace '[^0-9A-Za-z.-]', '.')

          "deb_version=$debVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "semver=$semVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_prerelease=$($isPreRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/test-results -Force | Out-Null

          $testProjects = Get-ChildItem -Path tests -Filter *.csproj -Recurse | Sort-Object FullName
          if (-not $testProjects) {
            throw "Aucun projet de test trouve sous tests/."
          }

          foreach ($project in $testProjects) {
            $trxName = "$($project.BaseName).trx"
            Write-Host "Execution des tests: $($project.FullName)"
            dotnet test $project.FullName -c Release --logger "trx;LogFileName=$trxName" --results-directory artifacts/test-results
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.version.outputs.deb_version }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Build .deb
        shell: pwsh
        run: |
          ./build-deb.ps1 -PackageVersion '${{ steps.version.outputs.deb_version }}'

      - name: Upload artefact .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ steps.version.outputs.deb_version }}
          path: artifacts/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Générer checksum et manifest de release
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SEMVER: ${{ steps.version.outputs.semver }}
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null

          $debFile = Get-ChildItem -Path artifacts/deb -Filter *.deb | Select-Object -First 1
          if (-not $debFile) {
            throw "Aucun paquet .deb trouvé dans artifacts/deb"
          }

          $checksum = (Get-FileHash -Path $debFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$checksum  $($debFile.Name)"
          $checksumLine | Set-Content -Path (Join-Path 'artifacts/release' "$($debFile.BaseName).sha256") -Encoding utf8

          $channel = if ($env:IS_PRERELEASE -ne 'true') {
            'stable'
          }
          elseif ($env:BRANCH_NAME -eq 'develop') {
            'development'
          }
          elseif ($env:BRANCH_NAME.StartsWith('release/') -or $env:BRANCH_NAME.StartsWith('hotfix/')) {
            'beta'
          }
          else {
            'development'
          }

          $packageUrl = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:RELEASE_TAG)/$($debFile.Name)"
          $checksumUrl = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:RELEASE_TAG)/$($debFile.BaseName).sha256"
          $releaseUrl = "https://github.com/$($env:REPOSITORY)/releases/tag/$($env:RELEASE_TAG)"

          $manifest = [ordered]@{
            product = 'SvxlinkManagerV2'
            version = $env:SEMVER
            debianVersion = $env:DEB_VERSION
            channel = $channel
            packageType = 'deb'
            architecture = 'armhf'
            tag = $env:RELEASE_TAG
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            packageName = $debFile.Name
            packageUrl = $packageUrl
            sha256 = $checksum
            checksumUrl = $checksumUrl
            releaseNotesUrl = $releaseUrl
            prerelease = ($env:IS_PRERELEASE -eq 'true')
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path 'artifacts/release' 'manifest.json') -Encoding utf8

      - name: Upload artefacts release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ steps.version.outputs.deb_version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Resume du build
        shell: pwsh
        run: |
          $lines = @(
            '## Build Debian'
            ''
            '- GitVersion SemVer: `${{ steps.version.outputs.semver }}`'
            '- Version Debian: `${{ steps.version.outputs.deb_version }}`'
            '- Tag de release: `${{ steps.version.outputs.release_tag }}`'
            '- Branche: `${{ github.ref_name }}`'
          )

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Valider la branche de publication release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          $allowed = $env:BRANCH_NAME -in @('main', 'master', 'develop') -or
            $env:BRANCH_NAME.StartsWith('release/') -or
            $env:BRANCH_NAME.StartsWith('hotfix/')

          if (-not $allowed) {
            throw "Publication release interdite sur la branche '$($env:BRANCH_NAME)'. Branches autorisees: main/master/develop/release/*/hotfix/*."
          }

      - name: Publier une GitHub Release
        if: |
          (github.event_name == 'workflow_dispatch' &&
            inputs.publish_release && (
              github.ref_name == 'main' ||
              github.ref_name == 'master' ||
              github.ref_name == 'develop' ||
              startsWith(github.ref_name, 'release/') ||
              startsWith(github.ref_name, 'hotfix/')
            )) ||
          (github.event_name == 'push' && (
            github.ref_name == 'main' ||
            github.ref_name == 'master' ||
            github.ref_name == 'develop' ||
            startsWith(github.ref_name, 'release/') ||
            startsWith(github.ref_name, 'hotfix/')
          ))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: SvxlinkManagerV2 ${{ steps.version.outputs.semver }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            artifacts/deb/*.deb
            artifacts/release/*