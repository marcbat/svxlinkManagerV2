###################################################################
#
# Configuration file for the SvxReflector - Environnement de développement
# Utilisé par le container Docker svxreflector
#
# Compatible SVXLink 25.05 — Paramètres V3 (X.509)
#
###################################################################

[GLOBAL]
TIMESTAMP_FORMAT="%c"
LISTEN_PORT=5300

# Accepter tous les callsigns (environnement de développement)
ACCEPT_CALLSIGN=.*

# Codec audio autorisé
CODECS=OPUS

# PKI — Certificats X.509 pour le protocole V3
CERT_PKI_DIR=/var/lib/svxlink/pki
CERT_CA_HOOK=/usr/local/bin/dev-ca-hook.sh

###################################################################
# Talkgroups
###################################################################

# Talkgroup auquel sont rattachés les nœuds en protocole V1/V2 : ceux-ci ne
# connaissent pas la notion de talkgroup. Sans cette variable ils ne
# participent à aucun TG et restent muets sur un réflecteur qui en utilise —
# c'est le cas dès qu'un nœud V3 est présent.
TG_FOR_V1_CLIENTS=240

# Plage de talkgroups dans laquelle le réflecteur pioche pour un QSY aléatoire
# (déplacement d'une conversation hors d'un TG d'appel).
#
# Syntaxe : <borne basse>:<nombre de TG>, et non une plage à tiret — ici
# 2409900 à 2409999. La manpage svxreflector.conf(5) recommande de partir de
# <MCC>9900 ; le préfixe 240 est celui déjà retenu par cette stack de test.
RANDOM_QSY_RANGE=2409900:100

###################################################################
# ROOT_CA : Autorité de certification racine (auto-générée au premier démarrage)
###################################################################
[ROOT_CA]
COMMON_NAME=SvxReflector Dev Root CA
COUNTRY=CH

###################################################################
# ISSUING_CA : CA intermédiaire qui signe les CSR des nœuds
###################################################################
[ISSUING_CA]
COMMON_NAME=SvxReflector Dev Issuing CA
COUNTRY=CH

###################################################################
# SERVER_CERT : Certificat du serveur reflector
###################################################################
[SERVER_CERT]
COMMON_NAME=svxreflector
SUBJECT_ALT_NAME=DNS:svxreflector,DNS:localhost,IP:127.0.0.1

###################################################################
# TG#0 : Talkgroup par défaut (tous les nœuds)
###################################################################
[TG#0]
AUTO_QSY_AFTER=0
ALLOW=.*
SHOW_ACTIVITY=1

###################################################################
# TG#240 : talkgroup des nœuds V1/V2 (cf. TG_FOR_V1_CLIENTS).
# svxlink-node2 y est rattaché d'office ; svxlink-node3 le surveille
# (MONITOR_TGS), ce qui rend la coexistence V2/V3 observable.
###################################################################
[TG#240]
AUTO_QSY_AFTER=0
ALLOW=.*
SHOW_ACTIVITY=1

###################################################################
# TG#2403 : talkgroup d'appel de la stack de test, DEFAULT_TG de
# svxlink-node3.
#
# AUTO_QSY_AFTER déplace automatiquement une conversation qui s'y
# prolonge vers un TG tiré dans RANDOM_QSY_RANGE : c'est ce qui permet
# d'éprouver le QSY automatique sans le provoquer à la main. 30 s est
# volontairement court — en exploitation la valeur se compte en minutes.
###################################################################
[TG#2403]
AUTO_QSY_AFTER=30
ALLOW=.*
SHOW_ACTIVITY=1

###################################################################
# TG#2404 : cible de bascule, surveillée par svxlink-node3.
###################################################################
[TG#2404]
AUTO_QSY_AFTER=0
ALLOW=.*
SHOW_ACTIVITY=1


###################################################################
# USERS / PASSWORDS : authentification du protocole V2 (legacy)
#
# svxreflector 25.05 sert V2 et V3 en parallèle, mais un nœud
# TYPE=ReflectorV2 n'est accepté que s'il est déclaré ici. Sans ça le
# serveur journalise 'Unknown user "<indicatif>"' et répond
# "Access denied" — ACCEPT_CALLSIGN=.* ne suffit pas, il ne filtre que
# la forme de l'indicatif.
#
# [USERS]     : indicatif du nœud -> nom d'utilisateur
# [PASSWORDS] : nom d'utilisateur -> mot de passe, à faire correspondre
#               à AUTH_KEY dans la config du nœud
#
# Dev uniquement — ne pas reprendre ces valeurs en production.
###################################################################
[USERS]
# HB9GXP2-H : svxlink-node2, seul nœud V2 de la stack. Le réflecteur le
# rattache au TG 240 (TG_FOR_V1_CLIENTS).
HB9GXP2-H=node2
HB9GXP=app

[PASSWORDS]
node2=Passw0rd
app=Passw0rd
