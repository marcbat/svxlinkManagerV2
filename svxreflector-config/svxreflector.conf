###################################################################
#
# Configuration file for the SvxReflector - Environnement de développement
# Utilisé par le container Docker svxreflector
#
# Compatible SVXLink 19.09.2
#
###################################################################

[GLOBAL]
TIMESTAMP_FORMAT="%c"
LISTEN_PORT=5300

# Codec audio autorisé
CODECS=OPUS

###################################################################
# USERS : Mapping callsign -> groupe de mot de passe
# Chaque nœud SvxLink qui se connecte doit être listé ici.
# Ajouter les callsigns configurés via svxlinkmanager dans cette section.
###################################################################
[USERS]
HB9GXP-H=DevNodes
HB9GXP2-H=DevNodes

###################################################################
# PASSWORDS : Mot de passe pour chaque groupe
# Doit correspondre à AUTH_KEY dans le [ReflectorLogic] de svxlink.conf
###################################################################
[PASSWORDS]
DevNodes="Passw0rd"
