###################################################################
#
# Configuration file for the SvxReflector - Environnement de développement
# Utilisé par le container Docker svxreflector
#
# Compatible SVXLink 25.05 — Paramètres V3 (X.509)
#
###################################################################

[GLOBAL]
TIMESTAMP_FORMAT="%c"
LISTEN_PORT=5300

# Accepter tous les callsigns (environnement de développement)
ACCEPT_CALLSIGN=.*

# Codec audio autorisé
CODECS=OPUS

# PKI — Certificats X.509 pour le protocole V3
CERT_PKI_DIR=/var/lib/svxlink/pki
CERT_CA_HOOK=/usr/local/bin/dev-ca-hook.sh

###################################################################
# ROOT_CA : Autorité de certification racine (auto-générée au premier démarrage)
###################################################################
[ROOT_CA]
COMMON_NAME=SvxReflector Dev Root CA
COUNTRY=CH

###################################################################
# ISSUING_CA : CA intermédiaire qui signe les CSR des nœuds
###################################################################
[ISSUING_CA]
COMMON_NAME=SvxReflector Dev Issuing CA
COUNTRY=CH

###################################################################
# SERVER_CERT : Certificat du serveur reflector
###################################################################
[SERVER_CERT]
COMMON_NAME=svxreflector
SUBJECT_ALT_NAME=DNS:svxreflector,DNS:localhost,IP:127.0.0.1

###################################################################
# TG#0 : Talkgroup par défaut (tous les nœuds)
###################################################################
[TG#0]
AUTO_QSY_AFTER=0
ALLOW=.*
SHOW_ACTIVITY=1


###################################################################
# USERS / PASSWORDS : authentification du protocole V2 (legacy)
#
# svxreflector 25.05 sert V2 et V3 en parallèle, mais un nœud
# TYPE=ReflectorV2 n'est accepté que s'il est déclaré ici. Sans ça le
# serveur journalise 'Unknown user "<indicatif>"' et répond
# "Access denied" — ACCEPT_CALLSIGN=.* ne suffit pas, il ne filtre que
# la forme de l'indicatif.
#
# [USERS]     : indicatif du nœud -> nom d'utilisateur
# [PASSWORDS] : nom d'utilisateur -> mot de passe, à faire correspondre
#               à AUTH_KEY dans la config du nœud
#
# Dev uniquement — ne pas reprendre ces valeurs en production.
###################################################################
[USERS]
HB9GXP2-H=node2
HB9GXP=app

[PASSWORDS]
node2=Passw0rd
app=Passw0rd
