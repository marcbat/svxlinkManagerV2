# SvxLink configuration file — VARIANTE DOCKER (développement / test manuel)
#
# Copie de svxlink-config/svxlink.conf, qui reste le template de PRODUCTION
# (Orange Pi : carte son ALSA réelle, squelch et PTT sur GPIO).
# Seuls les paramètres matériels sont adaptés au conteneur, qui n'a ni carte
# son ni GPIO :
#   [Rx1] AUDIO_DEV=alsa:null, SQL_DET=VOX (au lieu de plughw:0 / GPIO)
#   [Tx1] AUDIO_DEV=alsa:null, PTT_TYPE=Dummy (au lieu de plughw:0 / GPIO)
#
# VOX_THRESH et VOX_FILTER_DEPTH gardent les valeurs entières du template :
# SVXLink parse VOX_THRESH comme un entier et rejette une valeur décimale
# avec "Config variable Rx1/VOX_THRESH not set".
#
# SvxLinkConfigurationService conserve ces paramètres matériels lors de la
# génération : ils survivent donc à l'activation d'un salon.
#
# Template utilisé par SvxLinkConfigurationService pour générer la configuration

[GLOBAL]
LOGICS=SimplexLogic
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=16000
CARD_CHANNELS=1

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleHelp
CALLSIGN=F0DTMF
SHORT_IDENT_INTERVAL=600
LONG_IDENT_INTERVAL=3600
IDENT_ONLY_AFTER_TX=1
EXEC_CMD_ON_SQL_CLOSE=1
EVENT_HANDLER=/opt/svxlink-modern/share/svxlink/events.tcl
DEFAULT_LANG=fr_FR
RGR_SOUND_ALWAYS=1
RGR_SOUND_DELAY=0
REPORT_CTCSS=136.5
TX_CTCSS=ALWAYS
MACROS=Macros
FX_GAIN_NORMAL=0
FX_GAIN_LOW=-12
MUTE_RX_ON_TX=1
DTMF_CTRL_PTY=/tmp/dtmf_uhf

[Macros]
1=EchoLink:9999#

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
SQL_DET=VOX
GPIO_SQL_PIN=gpio10
SQL_START_DELAY=500
SQL_DELAY=150
SQL_HANGTIME=20
SQL_EXTENDED_HANGTIME=1000
SQL_EXTENDED_HANGTIME_THRESH=13
SQL_TIMEOUT=600
VOX_FILTER_DEPTH=300
VOX_THRESH=1000
CTCSS_MODE=0
CTCSS_FQ=71.9
CTCSS_SNR_OFFSET=0
CTCSS_OPEN_THRESH=15
CTCSS_CLOSE_THRESH=9
CTCSS_BPF_LOW=60
CTCSS_BPF_HIGH=260
GPIO_PATH=/sys/class/gpio
DEEMPHASIS=0
SQL_TAIL_ELIM=0
PREAMP=-4
PEAK_METER=1
DTMF_DEC_TYPE=INTERNAL
DTMF_MUTING=1
DTMF_HANGTIME=40
1750_MUTING=1

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
PTT_TYPE=Dummy
GPIO_PATH=/sys/class/gpio
PTT_PIN=gpio7
TIMEOUT=300
TX_DELAY=900
PREAMP=0
CTCSS_FQ=71.9
CTCSS_LEVEL=9
PREEMPHASIS=0
DTMF_TONE_LENGTH=100
DTMF_TONE_SPACING=50
DTMF_DIGIT_PWR=-15

[ModuleHelp]
NAME=ModuleHelp
ID=1
TIMEOUT=10

[ModuleParrot]
NAME=Parrot
ID=2
TIMEOUT=180
FIFO_LEN=60
REPEAT_DELAY=1000

[LinkToReflector]
CONNECT_LOGICS=SimplexLogic,ReflectorLogic
DEFAULT_ACTIVE=1
TIMEOUT=0

[ReflectorLogic]
TYPE=Reflector
HOST=rrf2.f5nlg.ovh
PORT=5300
CALLSIGN=(CH) HB9GXP H
AUTH_KEY=Magnifique123456789!
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=0
DEFAULT_LANG=fr_FR
EVENT_HANDLER=/opt/svxlink-legacy/share/svxlink/events.d/local/Logic.tcl

