[GLOBAL]
TIMESTAMP_FORMAT="%c"
LISTEN_PORT=5300
ACCEPT_CALLSIGN=.*
CODECS=OPUS

# Port du serveur HTTP de statut, lu par l'application pour savoir où interroger le
# réflecteur. Dans la stack Docker le démon vit dans un autre conteneur : c'est cette
# copie que voit l'application, elle doit donc annoncer le même port que
# svxreflector-config/svxreflector.conf.
HTTP_SRV_PORT=8888
CERT_PKI_DIR=/var/lib/svxlink/pki

[ROOT_CA]
COMMON_NAME=SvxReflector Root CA
COUNTRY=CH

[ISSUING_CA]
COMMON_NAME=SvxReflector Issuing CA
COUNTRY=CH

[SERVER_CERT]
COMMON_NAME=svxreflector
SUBJECT_ALT_NAME=DNS:localhost,IP:127.0.0.1

[TG#0]
AUTO_QSY_AFTER=0
ALLOW=.*
SHOW_ACTIVITY=1