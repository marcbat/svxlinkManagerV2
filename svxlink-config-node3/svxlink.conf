# SvxLink configuration file - Nœud 3 (second nœud en protocole V3)
#
# Un talkgroup n'a de sens qu'à partir de deux nœuds : sans ce troisième
# conteneur, un QSY, une priorité de monitoring ou un talker distant ne
# peuvent pas être observés dans la stack de test.
#
# Le nœud 2 reste en TYPE=ReflectorV2 : la coexistence V2/V3 sur un même
# réflecteur est le scénario réel de migration du parc, et elle doit rester
# testable.
#
# Ce nœud porte, comme le nœud applicatif, une SimplexLogic reliée à la
# ReflectorLogic par [LinkToReflector]. C'est ce lien qui rend les commandes
# talkgroup atteignables : le préfixe déclaré dans CONNECT_LOGICS est la seule
# porte vers ReflectorLogic::remoteCmdReceived (cf. #144). DTMF_CTRL_PTY permet
# de les composer sans radio, exactement comme le fait IDtmfPtyWriter.
#
# Version compatible: SVXLink 25.05 (protocole V3, certificats X.509)
################################################################################
# GLOBAL Configuration
################################################################################

[GLOBAL]
LOGICS=SimplexLogic,ReflectorLogic
LINKS=LinkToReflector
CFG_DIR=/etc/svxlink/conf.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=16000
CARD_CHANNELS=1

# Logique locale, image de celle que SvxLinkConfigurationService génère pour le
# nœud applicatif. DTMF_CTRL_PTY tient lieu de clavier DTMF : y écrire « 351240# »
# revient à composer la séquence sur la radio.
[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
CALLSIGN=HB9GXP3-H
SHORT_IDENT_INTERVAL=0
LONG_IDENT_INTERVAL=0
# events.tcl, pas events.d/local/Logic.tcl directement : c'est lui qui charge les
# gestionnaires standards puis leurs surcharges locales — dont notre Logic.tcl.
# Le pointer directement priverait la logique de tout le reste (every_second,
# identification, lecture des annonces).
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=fr_FR
MUTE_RX_ON_TX=1
DTMF_CTRL_PTY=/tmp/dtmf_uhf

# Le troisième champ de CONNECT_LOGICS (nom d'annonce) est volontairement absent :
# DEFAULT_ACTIVE=1 maintient le lien monté, l'annonce d'activation ne se produit
# jamais, et un nom ferait chercher un son Core/<nom>.wav inexistant.
[LinkToReflector]
CONNECT_LOGICS=SimplexLogic:35,ReflectorLogic
DEFAULT_ACTIVE=1
TIMEOUT=0

# Protocole V3 : pas d'AUTH_KEY. Le nœud génère sa clé privée et sa CSR au
# premier démarrage, le réflecteur la signe via CERT_CA_HOOK (dev-ca-hook.sh),
# et la CA est téléchargée par le nœud lui-même (CERT_DOWNLOAD_CA_BUNDLE, actif
# par défaut) — aucun partage de volume PKI n'est nécessaire entre conteneurs.
[ReflectorLogic]
TYPE=Reflector
HOSTS=svxreflector:5300
CALLSIGN=HB9GXP3-H
AUDIO_CODEC=OPUS
JITTER_BUFFER_DELAY=0
DEFAULT_LANG=fr_FR
EVENT_HANDLER=/usr/share/svxlink/events.tcl

# PKI du nœud, sur son propre volume : une CA régénérée côté réflecteur
# (volume recréé) doit pouvoir être invalidée ici sans toucher aux autres nœuds.
CERT_PKI_DIR=/var/lib/svxlink/pki
CERT_EMAIL=node3@svxlink.test

# Talkgroup d'émission par défaut, distinct de celui du nœud applicatif :
# c'est ce qui permet de vérifier que le réflecteur les place bien sur deux
# talkgroups différents, puis d'éprouver une bascule.
DEFAULT_TG=2403

# TG surveillés en plus du TG courant. 240 est celui auquel le réflecteur
# rattache les nœuds V2 (TG_FOR_V1_CLIENTS) : node3 entend donc node2.
# 2404 sert de cible au QSY automatique.
MONITOR_TGS=240,2404

TG_SELECT_TIMEOUT=30

# Récepteur avec périphérique audio null (pas de hardware dans le container)
[Rx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
SQL_DET=VOX
# Valeurs entières : SVXLink parse VOX_THRESH comme un entier et rejette une
# valeur décimale par « Config variable Rx1/VOX_THRESH not set ». Sans récepteur
# valide, SimplexLogic ne démarre pas et le lien perd sa moitié locale.
VOX_FILTER_DEPTH=300
VOX_THRESH=1000

# Émetteur avec périphérique audio null et PTT Dummy (pas de hardware dans le container)
[Tx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
PTT_TYPE=Dummy
TIMEOUT=300
