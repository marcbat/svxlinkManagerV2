services:
  # Application .NET avec SVXLink 25.05
  svxlinkmanager-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svxlinkmanager-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SQLite=Data Source=/app/data/svxlinkmanager.db
      - SA818__UseMock=true
      - SvxLink__UseMockDaemon=false
      - SystemMonitoring__DataPath=/app/data
      - ApplicationUpdate__GitHubToken=${GITHUB_TOKEN}
      # Le réflecteur local vit dans un autre conteneur : le salon « Réflecteur
      # Local » seedé doit viser le nom du service, pas l'adresse de bouclage.
      - LocalReflector__Host=svxreflector
      - LocalReflector__Port=5300
    volumes:
      # Variante Docker du template (audio/PTT en null/Dummy, pas de hardware
      # dans le conteneur). svxlink-config/ reste le template de production.
      - ./svxlink-config-docker:/etc/svxlink
      - ./logs:/app/logs
      - ./data:/app/data
      - svxlink-spool:/var/spool/svxlink
      - svxlink-logs:/var/log/svxlink
      - svxlink-pki-app:/var/lib/svxlink/pki
    depends_on:
      svxreflector:
        condition: service_started
    networks:
      - svxlink-network
    restart: unless-stopped

  # Nœud SVXLink 2 — protocole V2 (AUTH_KEY), conservé pour éprouver la
  # coexistence V2/V3 sur un même réflecteur : c'est le scénario réel de
  # migration du parc. Le réflecteur le rattache au TG défini par
  # TG_FOR_V1_CLIENTS, sans quoi il resterait muet.
  svxlink-node2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: svxlink-node2
    volumes:
      - ./svxlink-config-node2:/etc/svxlink
    depends_on:
      svxreflector:
        condition: service_started
    networks:
      - svxlink-network
    restart: unless-stopped

  # Nœud SVXLink 3 — protocole V3 (certificats X.509), second nœud V3 de la
  # stack. Un talkgroup, un QSY ou un talker distant n'ont de sens qu'à partir
  # de deux nœuds V3 : sans lui, le nœud applicatif se connecte au réflecteur
  # mais il ne peut rien s'y passer.
  svxlink-node3:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: svxlink-node3
    volumes:
      - ./svxlink-config-node3:/etc/svxlink
      # PKI propre au nœud : sa clé privée et le certificat signé par le
      # réflecteur ne doivent pas être partagés avec les autres conteneurs.
      - svxlink-pki-node3:/var/lib/svxlink/pki
    depends_on:
      svxreflector:
        condition: service_started
    networks:
      - svxlink-network
    restart: unless-stopped

  # SvxReflector - Serveur de conférence pour nœuds SvxLink
  svxreflector:
    build:
      context: .
      dockerfile: Dockerfile.reflector
    container_name: svxreflector
    volumes:
      - ./svxreflector-config:/etc/svxlink:ro
      - svxlink-pki-reflector:/var/lib/svxlink/pki
    networks:
      - svxlink-network
    restart: unless-stopped

networks:
  svxlink-network:
    driver: bridge

volumes:
  svxlink-spool:
    driver: local
  svxlink-logs:
    driver: local
  svxlink-pki-app:
    driver: local
  svxlink-pki-node3:
    driver: local
  svxlink-pki-reflector:
    driver: local
