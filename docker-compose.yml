services:
  # Application .NET avec SVXLink 19.09.2
  svxlinkmanager-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svxlinkmanager-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSQL=Host=postgresql;Database=svxlinkmanager;Username=svxlink;Password=${POSTGRES_PASSWORD:-changeme}
      - SA818__UseMock=true
      - SvxLink__UseMockDaemon=false
    volumes:
      - ./svxlink-config:/etc/svxlink
      - ./logs:/app/logs
      - svxlink-spool:/var/spool/svxlink
      - svxlink-logs:/var/log/svxlink
    depends_on:
      postgresql:
        condition: service_healthy
      svxreflector:
        condition: service_started
    networks:
      - svxlink-network
    restart: unless-stopped

  # Nœud SVXLink 2 - Second nœud pour tester la connexion multi-nœuds au réflecteur
  svxlink-node2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: svxlink-node2
    volumes:
      - ./svxlink-config-node2:/etc/svxlink
    depends_on:
      svxreflector:
        condition: service_started
    networks:
      - svxlink-network
    restart: unless-stopped

  # SvxReflector - Serveur de conférence pour nœuds SvxLink
  svxreflector:
    build:
      context: .
      dockerfile: Dockerfile.reflector
    container_name: svxreflector
    volumes:
      - ./svxreflector-config:/etc/svxlink:ro
    networks:
      - svxlink-network
    restart: unless-stopped

  # PostgreSQL Database
  postgresql:
    image: postgres:16-alpine
    container_name: svxlinkmanager-postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-svxlinkmanager}
      - POSTGRES_USER=${POSTGRES_USER:-svxlink}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svxlink -d svxlinkmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - svxlink-network
    restart: unless-stopped

networks:
  svxlink-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  svxlink-spool:
    driver: local
  svxlink-logs:
    driver: local
